# Requires Docker Compose >= 2.24.4 (!override). Always combine with docker-compose.yml.
services:
  fable:
    image: ${FABLE_IMAGE:?FABLE_IMAGE is required}
    build: !reset null
    ports: !override
      - "${FABLE_PORT_BIND:-127.0.0.1:8000}:8000"
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fable}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fable}
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
