stages: [lint, test, integration, build, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "develop"'

variables:
  PYTHON_IMAGE: python:3.12-slim
  NODE_IMAGE: node:22-alpine
  POETRY_VERSION: "2.4.1" # Match Dockerfile.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"
  POETRY_REQUESTS_TIMEOUT: "120"
  POETRY_INSTALLER_MAX_WORKERS: "4"

# Same opt-out convention as MLForge: build/deploy still run with SKIP_TESTS=true.
.skip-tests:
  rules:
    - if: '$SKIP_TESTS == "true"'
      when: never
    - when: on_success

.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      prefix: python-3.12-poetry-2.4.1
      files: [poetry.lock]
    paths: [.cache/pip/, .cache/pypoetry/]
  before_script:
    - python -m pip install "poetry==$POETRY_VERSION"

lint:
  extends: [.python, .skip-tests]
  stage: lint
  script:
    - poetry check --lock
    - python -m compileall -q src

.backend:
  extends: .python
  variables:
    TMPDIR: "$CI_PROJECT_DIR/.tmp"
  before_script:
    - mkdir -p "$TMPDIR"
    - python -m pip install "poetry==$POETRY_VERSION"
    - poetry install --no-interaction

test:backend:
  extends: [.backend, .skip-tests]
  stage: test
  script:
    # Report formatter is CI-only; no runtime/project dependency is added.
    - poetry run python -m pip install unittest-xml-reporting==3.2.0
    - poetry run python -m xmlrunner discover -s tests -o test-reports
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: test-reports/*.xml

test:frontend:
  extends: .skip-tests
  stage: test
  image: $NODE_IMAGE
  cache:
    key:
      prefix: node-22
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
  artifacts:
    expire_in: 1 day
    paths: [frontend/dist/]

integration:
  extends: [.backend, .skip-tests]
  stage: integration
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: fable_test
    POSTGRES_USER: fable_test
    POSTGRES_PASSWORD: fable_ci_test_only
    FABLE_TEST_DATABASE_URL: postgresql://fable_test:fable_ci_test_only@postgres:5432/fable_test
    FABLE_TEST_REDIS_URL: redis://redis:6379/0
  script:
    - |
      poetry run python - <<'PY'
      import os
      import time
      import psycopg
      import redis

      deadline = time.monotonic() + 90
      while True:
          try:
              with psycopg.connect(os.environ['FABLE_TEST_DATABASE_URL'], connect_timeout=3) as conn:
                  conn.execute('SELECT 1')
              with redis.Redis.from_url(os.environ['FABLE_TEST_REDIS_URL'], socket_connect_timeout=3, socket_timeout=3) as client:
                  client.ping()
              print('PostgreSQL and Redis ready')
              break
          except (psycopg.OperationalError, redis.RedisError):
              if time.monotonic() >= deadline:
                  raise
              time.sleep(2)
      PY
    - poetry run python -m unittest discover -s tests/integration -t . -v

build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG'
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build --cache-from "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - |
      smoke="fable-ci-smoke-$CI_JOB_ID"
      trap 'docker rm -fv "$smoke" >/dev/null 2>&1 || true' EXIT
      docker run -d --name "$smoke" --health-interval=2s --health-start-period=5s \
        -e API_KEY=ci-dummy -e BASE_URL=http://127.0.0.1:9/v1 -e MODEL=ci-dummy \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      healthy=false
      for attempt in $(seq 1 60); do
        status=$(docker inspect --format '{{.State.Health.Status}}' "$smoke")
        if [ "$status" = healthy ]; then healthy=true; break; fi
        if [ "$status" = unhealthy ] || [ "$(docker inspect --format '{{.State.Running}}' "$smoke")" != true ]; then break; fi
        sleep 2
      done
      if [ "$healthy" != true ]; then docker logs "$smoke"; exit 1; fi
      docker rm -fv "$smoke"
      trap - EXIT
    - |
      if [ "$CI_PIPELINE_SOURCE" != merge_request_event ]; then
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
          docker push "$CI_REGISTRY_IMAGE:latest"
        fi
        if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
          docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        fi
      fi

deploy:
  stage: deploy
  image: alpine:3.20
  resource_group: production
  variables:
    DEPLOY_PATH: /opt/fable
  rules:
    - if: '$DEPLOY_HOST && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG) && $CI_PIPELINE_SOURCE != "merge_request_event"'
      when: manual
      allow_failure: true
  environment:
    name: production
    url: $DEPLOY_URL
  before_script:
    - apk add --no-cache openssh-client
  script:
    - |
      set -eu
      : "${DEPLOY_USER:?Set DEPLOY_USER}"
      # Restrict the remote path because scp also passes it through a remote shell.
      case "$DEPLOY_PATH" in /*) ;; *) echo 'DEPLOY_PATH must be absolute'; exit 1;; esac
      case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) echo 'Unsafe DEPLOY_PATH'; exit 1;; esac
      case "$DEPLOY_USER" in ''|*[!a-zA-Z0-9_-]*) echo 'Unsafe DEPLOY_USER'; exit 1;; esac
      case "$DEPLOY_HOST" in -*|*[!a-zA-Z0-9.:-]*) echo 'Unsafe DEPLOY_HOST'; exit 1;; esac
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      key="$HOME/.ssh/fable-deploy"
      trap 'rm -f "$key"' EXIT
      if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
        tr -d '\r' < "$SSH_PRIVATE_KEY" > "$key"
      else
        : "${SSH_PRIVATE_KEY_B64:?Set SSH_PRIVATE_KEY (File) or SSH_PRIVATE_KEY_B64}"
        printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n' | base64 -d | tr -d '\r' > "$key"
      fi
      chmod 600 "$key"
      if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
      fi
      target="$DEPLOY_USER@$DEPLOY_HOST"
      ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p '$DEPLOY_PATH'"
      scp -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
        docker-compose.yml docker-compose.prod.yml "$target:$DEPLOY_PATH/"
      registry_user="${CI_DEPLOY_USER:-$CI_REGISTRY_USER}"
      registry_password="${CI_DEPLOY_PASSWORD:-$CI_JOB_TOKEN}"
      # Credentials go via encrypted stdin, not remote command arguments or .env.
      {
        printf '%s\n' "$DEPLOY_PATH" "$CI_REGISTRY" "$registry_user" "$registry_password" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        cat <<'REMOTE'
      set -eu
      cd "$DEPLOY_PATH"
      test -f .env || { echo 'Prepare server .env first'; exit 1; }
      DOCKER_CONFIG=$(mktemp -d)
      export DOCKER_CONFIG
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT
      printf '%s' "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin "$REGISTRY"
      unset REGISTRY_PASSWORD
      docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
      docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --remove-orphans --wait --wait-timeout 180
      id=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q fable)
      test -n "$id"
      test "$(docker inspect --format '{{.State.Health.Status}}' "$id")" = healthy
      REMOTE
      } | ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
        'IFS= read -r DEPLOY_PATH; IFS= read -r REGISTRY; IFS= read -r REGISTRY_USER; IFS= read -r REGISTRY_PASSWORD; IFS= read -r FABLE_IMAGE; export DEPLOY_PATH REGISTRY REGISTRY_USER REGISTRY_PASSWORD FABLE_IMAGE; sh -se'
