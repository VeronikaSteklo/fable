services:
  fable:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MEMORY_STORE_PATH: /data/chroma
      SESSIONS_PATH: /data/sessions
      AUTH_DB_PATH: /data/fable.db
    volumes:
      - fable-data:/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  fable-data:
