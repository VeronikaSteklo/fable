[project]
name = "fable"
version = "0.1.0"
description = ""
authors = [
    { name = "Veronika_Steklo", email = "151031140+VeronikaSteklo@users.noreply.github.com" },
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "langchain (>=1.4.5,<2.0.0)",
    "langchain-openai (>=1.7.1,<2.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
]

[project.scripts]
fable = "fable.game:main"

[tool.poetry]
packages = [{ include = "fable", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
