[project]
name = "fable"
version = "0.1.0"
description = ""
authors = [
    { name = "Veronika_Steklo", email = "151031140+VeronikaSteklo@users.noreply.github.com" },
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "openai (>=3.29,<3.30)",
    "chromadb (>=1.5,<1.6)",
    "pydantic (>=2.14.4,<3.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",
    "psycopg-pool (>=3.3.3,<4.0.0)",
    "redis (>=8.2.0,<9.0.0)",
]

[project.scripts]
fable = "fable.presentation.cli.main:main"
fable-server = "fable.presentation.web.app:main"
fable-eval = "fable.evaluation.cli:main"
fable-migrate = "fable.infrastructure.persistence.postgres.cli:main"

[tool.poetry]
packages = [{ include = "fable", from = "src" }]
include = [{ path = "src/fable/infrastructure/persistence/postgres/migrations/*.sql", format = ["sdist", "wheel"] }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "httpx (>=0.28.1,<0.29.0)"
]
