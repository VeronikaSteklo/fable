services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fable_test
      POSTGRES_USER: fable_test
      POSTGRES_PASSWORD: fable_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fable_test -d fable_test"]
      interval: 1s
      timeout: 3s
      retries: 60
    tmpfs:
      - /var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60
